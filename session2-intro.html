<style>
  :root{
    --red-dark:#6E1616;
    --red-deep:#4A0E0E;
    --red-accent:#8C1515;

    --cream:#F7F5F0;

    --card-bg:#EDE8DE;
    --ink:#1C1A18;
    --ink-soft:#55504A;
    --paper:#F3EFE6;
    --paper-soft:#D9CFC3;
    --gray-mid:#8B857C;
    --gray-line:#DAD5CB;
    --line-dark:rgba(245,240,230,0.18);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --serif:'Newsreader',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }

  html,body{height:100%;background:#0c0a09;}
  body{font-family:var(--sans);overflow:hidden;}
  .stage{position:fixed;inset:0;}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;
    padding:clamp(28px,4.5vw,64px) clamp(32px,5.5vw,80px);
    transition:opacity .35s ease;
  }
  .slide.active{display:flex;}
  .slide.dark{background:var(--red-dark);color:var(--paper);}
  .slide.light{background:var(--cream);color:var(--ink);}
  .em{font-family:var(--serif);font-style:italic;font-weight:500;}
  .eyebrow{
    font-family:var(--mono);font-size:clamp(10px,0.85vw,12px);letter-spacing:.14em;
    text-transform:uppercase;color:var(--gray-mid);
  }
  .slide.dark .eyebrow{color:var(--paper-soft);}
  .footer{
    position:absolute;left:0;right:0;bottom:22px;padding:0 clamp(32px,5.5vw,80px);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--gray-mid);
  }
  .slide.dark .footer{color:var(--paper-soft);}
  .dots{
    position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;
    gap:5px;pointer-events:none;
  }
  .dot{width:5px;height:5px;border-radius:1px;background:var(--gray-line);}
  .dot.active{background:var(--red-bright);}
  .body-copy{font-size:clamp(15px,1.35vw,19px);line-height:1.55;color:var(--ink-soft);max-width:52ch;}
  .slide.dark .body-copy{color:var(--paper-soft);}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:60px;}
  .statement-head{font-weight:400;font-size:clamp(30px,3.6vw,50px);line-height:1.12;max-width:22ch;}

  /* ---- Cover ---- */
  .cover-top{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--paper-soft);text-transform:uppercase;}
  .cover-headline{font-family:var(--sans);font-weight:300;font-size:clamp(42px,6.4vw,92px);line-height:1.02;margin-top:15vh;letter-spacing:-.01em;}
  .cover-sub{font-size:clamp(16px,1.7vw,24px);font-weight:300;color:var(--paper-soft);margin-top:22px;max-width:46ch;line-height:1.4;}
  .cover-meta{position:absolute;left:clamp(32px,5.5vw,80px);bottom:80px;display:flex;flex-direction:column;gap:5px;}
  .cover-meta .cm-when{font-size:16px;font-weight:600;}
  .cover-meta .cm-where{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--paper-soft);}

  /* ---- Framing ---- */
  .frame-copy{font-size:clamp(17px,1.55vw,22px);line-height:1.5;color:var(--ink-soft);max-width:60ch;}
  .frame-copy .em{color:var(--red-accent);}
  .frame-live{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:clamp(18px,1.7vw,24px);color:var(--red-accent);}

  /* ---- Speakers ---- */
  .speakers{margin-top:6px;border-top:1px solid var(--paper-soft);}
  .slide.dark .speakers{border-top-color:var(--line-dark);}
  .spk-row{display:grid;grid-template-columns:0.9fr 2.1fr;gap:28px;padding:20px 0;border-bottom:1px solid var(--line-dark);align-items:baseline;}
  .spk-name{font-size:clamp(19px,1.9vw,25px);font-weight:600;}
  .spk-title{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--paper-soft);margin-top:6px;line-height:1.4;}
  .spk-bio{font-size:14.5px;line-height:1.5;color:var(--paper-soft);}
  .spk-bio b{color:var(--paper);font-weight:600;}

  /* ---- TOC / numbered list ---- */
  .list4{margin-top:6px;border-top:1px solid var(--gray-line);}
  .slide.dark .list4{border-top-color:var(--line-dark);}
  .list4-row{display:grid;grid-template-columns:70px 1fr;gap:22px;padding:18px 0;border-bottom:1px solid var(--gray-line);align-items:baseline;}
  .slide.dark .list4-row{border-bottom-color:var(--line-dark);}
  .list4-num{font-family:var(--serif);font-style:italic;font-size:clamp(24px,2.6vw,32px);color:var(--red-accent);}
  .slide.dark .list4-num{color:var(--paper);}
  .list4-title{font-size:clamp(20px,2.1vw,27px);font-weight:500;}
  .list4-sub{font-size:14.5px;color:var(--ink-soft);margin-top:4px;}
  .slide.dark .list4-sub{color:var(--paper-soft);}

  /* ---- Recap opener needs ---- */
  .needs{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .need-tag{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    border:1px solid var(--line-dark);color:var(--paper);padding:9px 15px;}

  /* ---- Stat (big number) ---- */
  .stat-wrap{display:grid;grid-template-columns:auto 1fr;gap:clamp(28px,4vw,64px);align-items:center;}
  .stat-num{font-family:var(--sans);font-weight:300;font-size:clamp(96px,17vw,240px);line-height:.9;letter-spacing:-.03em;}
  .slide.light .stat-num{color:var(--red-accent);}
  .stat-side{display:flex;flex-direction:column;gap:16px;}
  .stat-claim{font-size:clamp(20px,2.1vw,30px);font-weight:500;line-height:1.2;max-width:20ch;}
  .stat-note{font-size:15px;line-height:1.5;color:var(--ink-soft);max-width:44ch;}
  .slide.dark .stat-note{color:var(--paper-soft);}
  .stat-note .em{color:var(--red-accent);}
  .slide.dark .stat-note .em{color:var(--paper);}
  .jcurve{margin-top:6px;}
  .jcurve svg{width:min(340px,42vw);height:auto;display:block;}

  /* ---- Weights (proportion bars) ---- */
  .weights{display:flex;flex-direction:column;gap:16px;margin-top:8px;max-width:78ch;}
  .wt-row{display:grid;grid-template-columns:230px 1fr 64px;gap:18px;align-items:center;}
  .wt-label{font-weight:600;font-size:15px;}
  .wt-label span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-mid);font-weight:400;margin-top:2px;}
  .wt-track{height:30px;background:var(--card-bg);}
  .wt-fill{height:100%;}
  .wt-fill.f1{background:var(--red-accent);}
  .wt-fill.f2{background:var(--tier3);}
  .wt-fill.f3{background:var(--tier2);}
  .wt-pct{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--red-accent);text-align:right;}
  .wt-note{margin-top:18px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-soft);max-width:64ch;line-height:1.5;}
  .wt-note .em{color:var(--red-accent);font-style:italic;}

  /* ---- Fears table ---- */
  .fears{margin-top:8px;border-top:1px solid var(--line-dark);}
  .fear-row{display:grid;grid-template-columns:1fr 1.5fr 34px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line-dark);align-items:baseline;}
  .fear-name{font-size:clamp(18px,1.8vw,23px);font-weight:600;}
  .fear-q{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--paper-soft);}
  .fear-arrow{color:var(--paper-soft);font-size:17px;}
  .fear-resp{font-size:15px;font-weight:600;color:var(--paper);}
  .fears-note{margin-top:16px;font-size:14.5px;color:var(--paper-soft);}
  .fears-note b{color:var(--paper);}

  /* ---- Factors / valley of death ---- */
  .valley-lead{font-size:16px;color:var(--ink-soft);max-width:60ch;line-height:1.5;}
  .valley-lead .em{color:var(--red-accent);}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px;}
  .card{background:var(--card-bg);padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-height:180px;}
  .card-letter{font-family:var(--mono);font-size:11px;color:var(--red-accent);letter-spacing:.08em;}
  .card-title{font-weight:700;font-size:18px;line-height:1.25;}
  .card-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.45;flex:1;}

  /* ---- Bridge / continue ---- */
  .bridge-copy{font-size:clamp(18px,1.7vw,24px);line-height:1.5;color:var(--paper-soft);max-width:56ch;}
  .bridge-copy .em{color:var(--paper);}
  .continue-btn{
    display:inline-flex;align-items:center;gap:12px;margin-top:26px;align-self:flex-start;
    background:var(--paper);color:var(--red-dark);text-decoration:none;font-weight:700;
    font-size:clamp(16px,1.6vw,21px);padding:16px 26px;transition:.15s;
  }
  .continue-btn:hover{background:#fff;}
  .continue-btn .arrow{font-family:var(--mono);}
  .continue-sub{margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-soft);}

  /* ---- index overlay ---- */
  #indexOverlay{
    position:fixed;inset:0;background:rgba(12,10,9,.96);z-index:50;display:none;
    padding:60px clamp(32px,6vw,90px);overflow-y:auto;
  }
  #indexOverlay.show{display:block;}
  #indexOverlay h2{color:var(--paper);font-weight:300;font-size:28px;margin-bottom:26px;}
  .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .idx-item{
    border:1px solid var(--line-dark);padding:14px 16px;cursor:pointer;color:var(--paper-soft);
    font-size:13px;line-height:1.4;transition:.15s;
  }
  .idx-item:hover{background:rgba(255,255,255,.06);color:var(--paper);}
  .idx-item .idx-num{font-family:var(--mono);color:var(--red-bright);margin-right:8px;}

  @media(max-width:820px){
    .spk-row{grid-template-columns:1fr;gap:6px;}
    .stat-wrap{grid-template-columns:1fr;gap:12px;}
    .wt-row{grid-template-columns:1fr;gap:6px;}
    .fear-row{grid-template-columns:1fr;gap:4px;}
    .fear-arrow{display:none;}
    .cards3{grid-template-columns:1fr;}
  }
</style>
</head>

function em(t){return (t||'').replace(/\*(.+?)\*/g,'<span class="em">$1</span>');}

  el.className = 'slide ' + (s.tone === 'dark' ? 'dark' : 'light');

  }

  }

  if(s.type==='factors'){
    title = s.head;
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head">${s.head}</div>
      <div class="valley-lead">${em(s.lead)}</div>
      <div class="cards3">
        ${s.cards.map(c=>`<div class="card">
          <div class="card-letter">${c[0]}</div>
          <div class="card-title">${c[1]}</div>
          <div class="card-desc">${c[2]}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }

  if(s.type==='bridge'){
    title = 'Bridge';
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head">${s.head}</div>
      <div class="bridge-copy">${em(s.copy)}</div>
      <a class="continue-btn" href="${s.href}">${s.cta} <span class="arrow">→</span> ${s.ctaLabel}</a>
      <div class="continue-sub">${s.sub}</div>
    </div>`;
  }

  el.innerHTML = html;
  el.dataset.title = title;
  if(s.foot) el.dataset.footLeft = s.foot;
  return el;
}

/* ============ MOUNT ============ */
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
const idxGrid = document.getElementById('idxGrid');
let current = 0;

S.forEach((s,i)=>{
  const el = render(s,i);
  stage.appendChild(el);
  const dot = document.createElement('div');
  dot.className='dot';
  dot.addEventListener('click',()=>go(i));
  dotsWrap.appendChild(dot);
  const idxItem = document.createElement('div');
  idxItem.className='idx-item';
  idxItem.innerHTML = `<span class="idx-num">${String(i+1).padStart(2,'0')}</span>${el.dataset.title}`;
  idxItem.addEventListener('click',()=>{go(i);toggleIndex(false);});
  idxGrid.appendChild(idxItem);
});

function go(i){
  if(i<0||i>=S.length) return;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  const el = stage.children[i];
  el.classList.add('active');
  dotsWrap.children[i].classList.add('active');
  document.getElementById('footerLeft').textContent = el.dataset.footLeft || '';
  document.getElementById('footerRight').textContent = (el.dataset.footRight || (`${String(i+1).padStart(2,'0')} of ${S.length}`));
  current = i;
}

function toggleIndex(force){
  const ov = document.getElementById('indexOverlay');
  const show = force!==undefined ? force : !ov.classList.contains('show');
  ov.classList.toggle('show', show);
}

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ toggleIndex(); return; }
  if(document.getElementById('indexOverlay').classList.contains('show')) return;
  if(e.key==='ArrowRight' || e.key===' ') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});

go(0);
</script>
</body>
</html>
